name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit only direct dependencies of the app (not Storybook dev tooling).
      # Known unpatched vulns live in storybook's crypto-browserify chain and
      # don't affect the deployed Next.js app.
      - name: Security audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Lint
        run: pnpm nx lint web

      - name: Type check
        run: pnpm exec tsc --project apps/web/tsconfig.json --noEmit

      - name: Build
        run: pnpm nx build web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOOK_PASSWORD: ${{ secrets.NOOK_PASSWORD }}
